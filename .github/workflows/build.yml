name: Build PSP
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile
        run: docker run --rm -v "$PWD":/src -w /src pspdev/pspdev make
      - name: Save EBOOT
        uses: actions/upload-artifact@v4
        with:
          name: GrannyPSP
          path: EBOOT.PBP
